name: Publish map to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - lib/reviewed-status.json
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx vite build --config vite.pages.config.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Wait for the Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts | any(.name == "github-pages" and .expired == false)' | grep -qx true; then
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded Pages artifact is still unavailable after 60 seconds."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
